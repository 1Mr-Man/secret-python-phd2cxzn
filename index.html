<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Au-Cu Scc(0) Calculator</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f7fa;
      color: #222;
    }

    .container {
      max-width: 1000px;
      margin: auto;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .inputs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      margin-top: 20px;
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      background: #006d77;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #00545c;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
    }

    th {
      background: #eee;
    }

    canvas {
      width: 100%;
      max-width: 900px;
      margin-top: 20px;
      border: 1px solid #ddd;
      background: white;
    }

    .formula {
      background: #f0f3f5;
      padding: 15px;
      border-radius: 6px;
      overflow-x: auto;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Au-Cu Concentration Fluctuation Calculator</h1>

  <div class="subtitle">
    Quasi-Chemical Model — Scc(0)
  </div>

  <div class="card">

    <h2>Model Parameters</h2>

    <div class="inputs">

      <div>
        <label>Temperature T (K)</label>
        <input id="temperature" type="number" value="1550">
      </div>

      <div>
        <label>Coordination Number Z</label>
        <input id="coordination" type="number" value="10">
      </div>

      <div>
        <label>Interchange Energy W (J/mol)</label>
        <input id="energy" type="number" value="-21500">
      </div>

      <div>
        <label>Concentration Step</label>
        <input id="step" type="number" value="0.1" step="0.01">
      </div>

    </div>

    <button onclick="calculate()">
      Calculate Scc(0)
    </button>

  </div>


  <div class="card">

    <h2>Equation</h2>

    <div class="formula">

      η² = exp[2W / (ZRT)]

      <br><br>

      β = √[1 + 4x(1−x)(η²−1)]

      <br><br>

      Scc(0) =
      x(1−x) /
      [1 + (Z/2)((1−β)/β)]

    </div>

  </div>


  <div class="card">

    <h2>Results</h2>

    <div id="results">
      Enter the parameters and click Calculate.
    </div>

  </div>


  <div class="card">

    <h2>Scc(0) Graph</h2>

    <canvas id="chart" width="900" height="500"></canvas>
  </div>

</div>

<script type="module" src="/app/main.ts"></script>

</body>
</html>
