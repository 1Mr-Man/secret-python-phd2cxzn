<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Materials Physics Workbench</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f7fa;
      color: #222;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 10px;
    }

    .subtitle a {
      color: #006d77;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    #material-form table,
    #results-panel table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    #material-form td, #material-form th,
    #results-panel td, #results-panel th {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
    }

    #results-panel th {
      background: #eee;
    }

    #material-form select { width: auto; }
    #material-form input { width: 100px; display: inline-block; }

    #conditions-form > div,
    #parameter-form > div {
      display: inline-block;
      width: 220px;
      margin: 0 15px 15px 0;
      vertical-align: top;
    }

    button {
      margin-top: 10px;
      margin-right: 10px;
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      background: #006d77;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover:not(:disabled) {
      background: #00545c;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    canvas {
      width: 100%;
      max-width: 900px;
      margin-top: 20px;
      border: 1px solid #ddd;
      background: white;
    }

    #error-message {
      display: none;
      background: #fdecea;
      color: #611a15;
      border: 1px solid #f5c6cb;
      border-radius: 6px;
      padding: 12px 16px;
      margin-bottom: 20px;
    }

    .model-assumptions {
      background: #f0f3f5;
      padding: 15px;
      border-radius: 6px;
      margin-top: 15px;
    }

    .model-assumptions h3 { margin-top: 0; }
    .model-assumptions h4 { margin-bottom: 4px; }

    .warnings {
      background: #fff8e1;
      border: 1px solid #ffe0a3;
      border-radius: 6px;
      padding: 10px 15px;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Materials Physics Workbench</h1>

  <div class="subtitle">
    Any registered model, any material system — <a href="/index.html">classic Au-Cu Scc(0) calculator</a>
  </div>

  <div id="error-message"></div>

  <div class="card">
    <h2>Material System</h2>
    <div id="material-form"></div>
  </div>

  <div class="card">
    <h2>Model</h2>
    <div id="model-picker"></div>
  </div>

  <div class="card">
    <h2>Conditions</h2>
    <div id="conditions-form"></div>
  </div>

  <div class="card">
    <h2>Parameters</h2>
    <div id="parameter-form"></div>
  </div>

  <div class="card">
    <button id="calculate-button" type="button">Calculate</button>
    <button id="sweep-button" type="button">Sweep Composition (binary only)</button>
    <button id="export-csv" type="button" disabled>Export Sweep as CSV</button>
  </div>

  <div class="card">
    <h2>Results</h2>
    <div id="results-panel">Enter a material system and click Calculate.</div>
  </div>

  <div class="card">
    <h2>Composition Sweep Chart</h2>
    <canvas id="workbench-chart" width="900" height="500"></canvas>
  </div>

</div>

<script type="module" src="/app/workbench/main.ts"></script>

</body>
</html>
